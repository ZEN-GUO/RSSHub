name: Sync upstream RSSHub
on:
  schedule:
    - cron: "0 * * * *"   # 每小时同步一次
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          fetch-depth: 0

      - name: Add upstream & fetch
        run: |
          git remote add upstream https://github.com/DIYgod/RSSHub.git || true
          git fetch upstream master

      - name: Merge upstream/master -> master
        run: |
          git checkout master
          git merge --ff-only upstream/master || git merge --no-edit upstream/master

      - name: Push
        run: |
          git push origin master
